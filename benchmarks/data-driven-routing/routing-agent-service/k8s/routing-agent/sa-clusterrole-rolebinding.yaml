apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: routing-agent-reader
rules:
- apiGroups: [""] # The core API group
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: routing-agent-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: routing-agent-reader-binding
subjects:
- kind: ServiceAccount
  name: routing-agent-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: routing-agent-reader
  apiGroup: rbac.authorization.k8s.io