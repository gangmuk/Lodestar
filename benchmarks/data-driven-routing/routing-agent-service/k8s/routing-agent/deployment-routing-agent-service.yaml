apiVersion: apps/v1
kind: Deployment
metadata:
  name: routing-agent-service
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: routing-agent-service
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 100%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: routing-agent-service
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: machine.cluster.vke.volcengine.com/gpu-name
                operator: In
                values:
                - NVIDIA-L20
      containers:
      - env:
        - name: PORT
          value: "8080"
        - name: LOG_LEVEL
          value: INFO
        - name: EXPLORE_ENABLED
          value: "1"
        - name: EXPLORATION_RATE
          value: "0.1"
        - name: MODEL
          value: simpler_contextual_bandit
        - name: ENABLE_ONLINE_LEARNING
          value: "true"
        image: aibrix-container-registry-cn-beijing.cr.volces.com/aibrix/gangmuk-routing-agent:latest
        imagePullPolicy: Always
        name: routing-agent
        ports:
        - containerPort: 8080
          protocol: TCP
        resources:
          limits:
            cpu: "5"
            memory: 2Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: 200m
            memory: 200Mi
            nvidia.com/gpu: "1"
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 5
