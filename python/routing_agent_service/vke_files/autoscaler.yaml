apiVersion: autoscaling.aibrix.ai/v1alpha1
kind: PodAutoscaler
metadata:
  name: llama-3-8b-instruct-kpa
  namespace: default
  labels:
    app.kubernetes.io/name: aibrix
    app.kubernetes.io/managed-by: kustomize
  annotations:
    autoscaling.aibrix.ai/scale-up-tolerance: "0.05"
    autoscaling.aibrix.ai/scale-down-tolerance: "0.05"
    autoscaling.aibrix.ai/panic-threshold: "2"
    autoscaling.aibrix.ai/scale-down-cooldown-window: "120s"
spec:
  scalingStrategy: KPA
  minReplicas: 1
  maxReplicas: 8
  metricsSources:
    - metricSourceType: pod
      protocolType: http
      port: '8000'
      path: metrics
      targetMetric: gpu_cache_usage_perc
      targetValue: '0.1'
      # targetMetric: num_requests_running
      # targetValue: '3'
      # targetMetric: num_requests_waiting
      # targetValue: '3'
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llama-3-8b-instruct