apiVersion: apps/v1
kind: Deployment
metadata:
  name: aibrix-gateway-plugins
  namespace: aibrix-system
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: gateway-plugins
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: gateway-plugins
    spec:
      containers:
      - env:
        - name: REDIS_HOST
          value: aibrix-redis-master
        - name: REDIS_PORT
          value: "6379"
        - name: AIBRIX_POD_METRIC_REFRESH_INTERVAL_MS
          value: "50"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        image: aibrix-container-registry-cn-beijing.cr.volces.com/aibrix/gateway-plugins:gangmuk-20250415-gatewaylog-00572df
        imagePullPolicy: Always
        name: gateway-plugin
        ports:
        - containerPort: 50052
          protocol: TCP
        - containerPort: 6060
          protocol: TCP
        resources:
          limits:
            cpu: "2"
            memory: 8Gi
          requests:
            cpu: "2"
            memory: 8Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - sh
        - -c
        - until echo "ping" | nc aibrix-redis-master 6379 -w 1  | grep -c PONG; do
          echo waiting for service aibrix-redis-master; sleep 2; done
        image: aibrix-container-registry-cn-beijing.cr.volces.com/aibrix/busybox:stable
        imagePullPolicy: IfNotPresent
        name: init-c
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: aibrix-gateway-plugins
      serviceAccountName: aibrix-gateway-plugins
      terminationGracePeriodSeconds: 30